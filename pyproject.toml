[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "httpx",
  "apscheduler",
  "holidays",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
