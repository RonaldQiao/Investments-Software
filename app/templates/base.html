<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ fund_name }} — {{ title|default('Dashboard') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header><div class="nav"><a class="brand" href="/">{{ fund_name }}</a><nav>
  <a class="{{ 'active' if request.url.path == '/' else '' }}" href="/">Dashboard</a><a class="{{ 'active' if request.url.path == '/positions' else '' }}" href="/positions">Positions</a><a class="{{ 'active' if request.url.path == '/trades' else '' }}" href="/trades">Trades</a><a class="{{ 'active' if request.url.path == '/pnl' else '' }}" href="/pnl">P&amp;L</a>
  <a class="{{ 'active' if request.url.path == '/capital' else '' }}" href="/capital">Capital</a><a class="{{ 'active' if request.url.path == '/fees' else '' }}" href="/fees">Fees</a><a class="{{ 'active' if request.url.path == '/history' else '' }}" href="/history">History</a><a class="{{ 'active' if request.url.path == '/settings' else '' }}" href="/settings">Settings</a>
</nav></div></header>
<main><div class="page-head"><h1>{{ title|default('Dashboard') }}</h1>{% block actions %}{% endblock %}</div>
{% if error or ok %}<p class="flash">{% if error %}<span class="error">{{ error }}</span>{% endif %}{% if ok %}<span class="ok">{{ ok }}</span>{% endif %}</p>{% endif %}
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', path='app.js') }}"></script>
</body></html>
